[project]
name = "brian2-atlas"
version = "0.2.0.dev1"
authors = [
    {name = 'Xinjun Li'},
    {name = 'Marcel Stimberg'},
    {name = 'Dan Goodman'},
    {name = 'Benjamin Evans'},
    {name = 'Romain Brette'}
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.2.0",
    'cython>=0.29.21',
    'sympy>=1.2',
    'pyparsing>=3,!=3.2.4',
    'jinja2>=2.7',
    'py-cpuinfo;platform_system=="Windows"',
    'setuptools>=61',
    'packaging',
]
readme = {file = 'README.pypi.md', content-type = 'text/markdown'}
description = 'Brian2 Atlas: Brian-compatible simulation and native training backends'
keywords = ['computational neuroscience', 'simulation', 'neural networks', 'spiking neurons', 'biological neural networks', 'research']
classifiers = [
    'Development Status :: 3 - Alpha',
    'Intended Audience :: Science/Research',
    'Natural Language :: English',
    'Operating System :: POSIX :: Linux',
    'Operating System :: MacOS',
    'Programming Language :: Python',
    'Programming Language :: Python :: 3',
    'Topic :: Scientific/Engineering :: Bio-Informatics'
]
license = 'CECILL-2.1 AND Apache-2.0'
license-files = ["LICENSE", "LICENSES/*", "LICENSE_SCOPE.md", "NOTICE", "AUTHORS", "CONTRIBUTORS"]

[project.optional-dependencies]
cloud = ['modal>=1.5.5']
examples = [
    'matplotlib>=3.9',
    'joblib>=1.4',
    'noise>=1.2.2',
    'opencv-python-headless>=4.10',
    'progressbar2>=4.5',
    'sbi>=0.25',
]
test = ['pytest>=8', 'pytest-xdist>=1.22.3', 'pytest-cov>=2.0', 'pytest-timeout']
docs = ['sphinx>=7,<9', 'ipython>=5', 'sphinx-tabs']

[project.urls]
Homepage = 'https://github.com/RockLi/brian2-atlas'
Documentation = 'https://github.com/RockLi/brian2-atlas/blob/dev/documentation/README.md'
Source = 'https://github.com/RockLi/brian2-atlas'
Tracker = 'https://github.com/RockLi/brian2-atlas/issues'
Upstream = 'https://github.com/brian-team/brian2'
Preprint = 'https://github.com/RockLi/brian2-atlas-preprint'

[project.scripts]
b2-runner = 'brian2_rust._cli:runner'
b2-train = 'brian2_rust._cli:train'

[tool.setuptools]
zip-safe = false
include-package-data = true

[build-system]
requires = [
    # PEP 639 SPDX expressions and project.license-files require modern setuptools.
    "setuptools>=77.0.3",
    "numpy>=2.2.0",
    "wheel",
    "Cython",
]
build-backend = "setuptools.build_meta"

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # isort
    "I",
]
# Lambda functions are ok (E731),
# long lines are already handled by the formatter (E501)
# For LaTeX code, percent format or `.format` is often the most readable (UP031, UP032)
# TODO: Would be good practice to set stacklevel for warnings (B028)
# False positives when using a name to test for its existence (B018)
extend-ignore = ["E731", "E501", "UP031", "UP032", "B028", "B018"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.cibuildwheel]
build = "cp312-manylinux_x86_64 cp313-manylinux_x86_64 cp314-manylinux_x86_64"
test-command = "python {project}/dev/atlas/test_wheel.py"
test-requires = ["pip"]
build-verbosity = 1

[tool.cibuildwheel.linux]
archs = ["x86_64"]
manylinux-x86_64-image = "quay.io/pypa/manylinux_2_28_x86_64@sha256:9555ba6c479fa69a2aa80ad1dc57154a60d562b19df159361d9379a02beb1e36"
before-all = "bash {project}/dev/atlas/install_release_rust.sh"
before-build = "python -m pip install wheel==0.48.0"
environment = { PATH = "/root/.cargo/bin:$PATH", CARGO_BUILD_JOBS = "2", PYTHONDONTWRITEBYTECODE = "1", OPENBLAS_NUM_THREADS = "1", OMP_NUM_THREADS = "1" }
repair-wheel-command = "python {project}/dev/atlas/repair_wheel.py {wheel} {dest_dir}"
