name: Atlas TestPyPI release

on:
  push:
    branches: [codex/testpypi-release]
    tags: ['testpypi-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-testpypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Validate the candidate identity
        id: version
        run: |
          python - <<'PY'
          import os, tomllib
          version = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']
          ref = os.environ['GITHUB_REF']
          if ref.startswith('refs/tags/'):
              assert ref == f'refs/tags/testpypi-v{version}', (ref, version)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
          PY
      - name: Build and check the source distribution
        run: |
          python -m pip install build twine pytest packaging
          python -m pytest -q dev/atlas/test_release_tools.py
          python -m build --sdist --outdir dist
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  linux:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python: ['cp312', 'cp313', 'cp314']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-sdist
          path: source-dist
      - name: Build, repair and exercise the final manylinux wheel
        env:
          CIBW_BUILD: ${{ matrix.python }}-manylinux_x86_64
        run: |
          python -m pip install cibuildwheel==4.3.5 twine
          python -m cibuildwheel --platform linux --output-dir wheelhouse source-dist/*.tar.gz
          python -m twine check --strict wheelhouse/*.whl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-linux-${{ matrix.python }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    needs: [source, linux]
    # Branch pushes and manual runs only build. Publishing requires a versioned tag.
    if: startsWith(github.ref, 'refs/tags/testpypi-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: testpypi
      url: https://test.pypi.org/project/brian2-atlas/${{ needs.source.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Record the exact artifacts being published
        run: |
          sha256sum dist/* | tee SHA256SUMS
          cat SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: publication-checksums
          path: SHA256SUMS
      - name: Publish to TestPyPI using OIDC
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/

  verify-testpypi:
    needs: [source, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: release-*
          merge-multiple: true
          path: expected
      - name: Download the release and verify every artifact hash
        env:
          ATLAS_VERSION: ${{ needs.source.outputs.version }}
        run: |
          python -m pip install packaging
          python dev/atlas/verify_testpypi.py "$ATLAS_VERSION" expected downloaded
      - name: Install from the downloaded wheel and exercise the installed package
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          python -m venv installed
          installed/bin/python -m pip install --index-url https://pypi.org/simple/ downloaded/*.whl
          installed/bin/python dev/atlas/test_wheel.py --report installed-testpypi.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: testpypi-validation-${{ matrix.python }}
          path: installed-testpypi.json
          if-no-files-found: warn
