name: Atlas PyPI release

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/release-pypi.yml'
      - 'dev/atlas/*release*'
      - 'dev/atlas/verify_testpypi.py'
      - 'pyproject.toml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install release tools
        run: python -m pip install build twine pytest packaging
      - name: Validate release identity and merged source
        id: version
        run: |
          python dev/atlas/check_release.py
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            git merge-base --is-ancestor "$GITHUB_SHA" origin/dev
          fi
      - name: Build and check the source distribution
        run: |
          python -m pytest -q dev/atlas/test_release_tools.py
          python -m build --sdist --outdir dist
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  linux:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python: ['cp312', 'cp313', 'cp314']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-sdist
          path: source-dist
      - name: Build, repair and exercise the final manylinux wheel
        env:
          CIBW_BUILD: ${{ matrix.python }}-manylinux_x86_64
        run: |
          python -m pip install cibuildwheel==4.3.5 twine
          python -m cibuildwheel --platform linux --output-dir wheelhouse source-dist/*.tar.gz
          python -m twine check --strict wheelhouse/*.whl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-linux-${{ matrix.python }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  macos:
    needs: source
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python: ['cp312', 'cp313', 'cp314']
        platform:
          - { runner: macos-15, arch: arm64 }
          - { runner: macos-15-intel, arch: x86_64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-sdist
          path: source-dist
      - name: Build, repair and exercise the native macOS wheel
        env:
          CIBW_BUILD: ${{ matrix.python }}-macosx_${{ matrix.platform.arch }}
        run: |
          python -m pip install cibuildwheel==4.3.5 twine
          python -m cibuildwheel --platform macos --output-dir wheelhouse source-dist/*.tar.gz
          python -m twine check --strict wheelhouse/*.whl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-macos-${{ matrix.platform.arch }}-${{ matrix.python }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    needs: [source, linux, macos]
    # Branch pushes and manual runs only build. Publishing requires a versioned tag.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/brian2-atlas/${{ needs.source.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Record the exact artifacts being published
        run: |
          sha256sum dist/* | tee SHA256SUMS
          cat SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: publication-checksums
          path: SHA256SUMS
      - name: Publish to PyPI using OIDC
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          packages-dir: dist/

  verify-pypi:
    needs: [source, publish]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13', '3.14']
        os: [ubuntu-24.04, macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: release-*
          merge-multiple: true
          path: expected
      - name: Download the release and verify every artifact hash
        env:
          ATLAS_VERSION: ${{ needs.source.outputs.version }}
        run: |
          python -m pip install packaging
          python dev/atlas/verify_testpypi.py "$ATLAS_VERSION" expected downloaded --index pypi
      - name: Install from the downloaded wheel and exercise the installed package
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          python -m venv installed
          installed/bin/python -m pip install --index-url https://pypi.org/simple/ downloaded/*.whl
          installed/bin/python dev/atlas/test_wheel.py --report installed-pypi.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pypi-validation-${{ matrix.os }}-${{ matrix.python }}
          path: installed-pypi.json
          if-no-files-found: warn
