[package]
name = "b2-runner"
version = "0.0.1"
edition = "2021"
publish = false
description = "Atlas native simulation and training executors"
default-run = "b2-runner"
license = "CECILL-2.1"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "b2-train"
path = "src/train_main.rs"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.100"
